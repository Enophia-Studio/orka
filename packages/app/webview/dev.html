<!DOCTYPE html>
<!--
  Standalone preview of the chat webview for UI work: stubs the VS Code API, applies VS Code-like
  theme variables and replays a scripted agent session. Build first (npm run build), then open
  this file in a browser. Append ?light for the light theme, ?empty for the empty state, ?tr for Turkish,
  ?settings=skills (or agents/providers/control) to open a settings tab, ?catalog for Settings > MCP > Catalog
  (?catalog=details with two entries open, ?catalog=add with the Add form and, on Continue, the consent dialog), ?gallery for
  Settings > Skills > Gallery (?gallery=details with two entries open, ?gallery=preview with a skill's text, ?gallery=install with
  the download consent dialog), ?ide for the desktop app's
  window (its IDE layout and its own theme), with ?collapsed for its sidebar closed. With ?ide,
  ?radar=off, ?radar=pending, ?radar=report or ?radar=elsewhere (another window runs it) opens the
  Radar tab in that state, ?auto with radar.autoAnalyze on (the panel's buttons work: turn it on,
  Analyze, Stop, Start a session). With ?ide, ?files opens the Files tab on a small in-memory
  folder, ?editor also opens LobbyManager.cs in the editor, ?idle ends the sample run (so Save
  works), ?conflict makes the first save find the file changed on disk, and ?edited marks
  LobbyManager.cs as edited by the user in Changes (whose hunks ?ide highlights). With ?ide, ?picker
  opens Orka's own folder picker ("Open folder…") on a small in-memory disk. With ?ide, ?live
  opens two sessions: LobbyDemo's, shown and running, and SharedLib's, waiting for an approval in the
  background (its row, the badge and the window title show it). With ?ide, ?browser opens the
  Browser tab on a page of a local dev server (frames drawn here), ?browser=empty with no page yet,
  ?browser=control with the page taken over (clicks and keys show on the drawn page), and
  ?browser=error after an address that could not be opened.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orka – webview preview</title>
  <link rel="stylesheet" href="../dist/webview.css">
  <script>
    // ?ide: the desktop page sets these attributes and loads these two stylesheets.
    if (new URLSearchParams(location.search).has('ide')) {
      document.documentElement.dataset.layout = 'ide';
      document.documentElement.dataset.theme = new URLSearchParams(location.search).has('light') ? 'light' : 'dark';
      // The editor's bundle comes before webview.js, as on the desktop page.
      document.write('<link rel="stylesheet" href="../dist/ide.css"><link rel="stylesheet" href="../dist/editor.css"><link rel="stylesheet" href="desktop-theme.css"><script src="../dist/editor.js"><\/script>');
    }
  </script>
  <style>

    html:not([data-layout]) {
      --vscode-font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      --vscode-font-size: 13px;
      --vscode-editor-font-family: Consolas, 'Cascadia Code', monospace;
    }
    html.dark {

      --vscode-sideBar-background: #181818;
      --vscode-editor-background: #1f1f1f;
      --vscode-editorWidget-background: #202020;
      --vscode-panel-border: #2b2b2b;
      --vscode-input-background: #313131;
      --vscode-input-foreground: #cccccc;
      --vscode-input-border: #3c3c3c;
      --vscode-button-background: #0078d4;
      --vscode-button-foreground: #ffffff;
      --vscode-button-hoverBackground: #026ec1;
      --vscode-button-secondaryBackground: #313131;
      --vscode-button-secondaryForeground: #cccccc;
      --vscode-dropdown-background: #313131;
      --vscode-dropdown-foreground: #cccccc;
      --vscode-dropdown-border: #3c3c3c;
      --vscode-focusBorder: #0078d4;
      --vscode-textLink-foreground: #4daafc;
      --vscode-textCodeBlock-background: #2b2b2b;
      --vscode-errorForeground: #f85149;
      --vscode-editorWarning-foreground: #cca700;
      --vscode-testing-iconPassed: #73c991;
      --vscode-inputValidation-errorBackground: #5a1d1d;
      --vscode-toolbar-hoverBackground: #5a5d5e50;
      --vscode-gitDecoration-addedResourceForeground: #81b88b;
      --vscode-gitDecoration-modifiedResourceForeground: #e2c08d;
      --vscode-gitDecoration-deletedResourceForeground: #c74e39;
      --vscode-charts-yellow: #e2b340;

      --vscode-foreground: #3b3b3b;
      --vscode-descriptionForeground: #6f6f6f;
      --vscode-sideBar-background: #f8f8f8;
      --vscode-editor-background: #ffffff;

      --vscode-panel-border: #e5e5e5;

      --vscode-button-background: #005fb8;
      --vscode-button-foreground: #ffffff;
      --vscode-button-hoverBackground: #0258a8;
      --vscode-button-secondaryBackground: #e5e5e5;
      --vscode-button-secondaryForeground: #3b3b3b;
      --vscode-dropdown-background: #ffffff;
      --vscode-dropdown-foreground: #3b3b3b;
      --vscode-dropdown-border: #cecece;
      --vscode-focusBorder: #005fb8;
      --vscode-textLink-foreground: #005fb8;
      --vscode-textCodeBlock-background: #f0f0f0;
      --vscode-errorForeground: #c72e0f;

      --vscode-testing-iconPassed: #388a34;

</head>
<body>
  <div id="app"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const ide = params.has('ide');
    if (!ide) document.documentElement.className = params.has('light') ? 'light' : 'dark';
    let theme = params.has('light') ? 'light' : 'dark';
    const sent = [];
    const ago = (s) => new Date(Date.now() - s * 1000).toISOString();
    const task = (id, title, updated, requests = 1) => ({ id, title, createdAt: ago(updated + 600), updatedAt: ago(updated), requests });
    window.acquireVsCodeApi = () => ({
      postMessage(message) {
        sent.push(message);
        console.log('[webview -> extension]', message);
        if (message.type === 'ready') setTimeout(replay, 0);
        if (message.type === 'previewGallerySkill') setTimeout(() => deliver({ type: 'skillPreview', id: message.id, text: '---\nname: ' + message.id + '\ndescription: Godot 4 projects (GDScript or C#, scenes, resources, autoloads, export).\nlicense: MIT\n---\n\n# Godot\n\n## Orient first\n- Read `project.godot`: the engine version, autoloads, input map and main scene.\n- Never edit `.godot/` (the import cache) or `.import` files.\n\n## GDScript habits\n- Type everything: `var speed: float = 200.0`.\n- <b>markup is shown as text</b>' }), 150);
        if (message.type === 'installGallerySkill' && message.id === 'ui-ugui') setTimeout(() => deliver({ type: 'dialog', id: 'gallery-consent', dialog: { kind: 'message', level: 'warning', modal: true, text: 'Install the skill Unity uGUI?', detail: 'Orka downloads 3 files (14 KB) over HTTPS from GitHub, at a fixed commit, and checks each one against the size and checksum it expects:\n\nhttps://raw.githubusercontent.com/Unity-Technologies/skills/60f95e6d4beaeacf4dfdff7829ec9b35008a0be0/LICENSE.md\nhttps://raw.githubusercontent.com/Unity-Technologies/skills/60f95e6d4beaeacf4dfdff7829ec9b35008a0be0/skills/ui-ugui/SKILL.md\nhttps://raw.githubusercontent.com/Unity-Technologies/skills/60f95e6d4beaeacf4dfdff7829ec9b35008a0be0/skills/ui-ugui/references/layout.md\n\nIt is made by Unity Technologies, not by Orka. Licence: Unity Companion License.\n\nUnity Companion License: use it only together with the Unity Engine, under your Unity licence.\n\nOrka never runs its scripts. When an agent uses the skill it may ask to run them, with the usual approval.\n\nIt is installed in your skills folder as C:\\Users\\you\\.orka\\skills\\ui-ugui.', actions: ['Download and install'] } }), 0);
        if (message.type === 'addMcpFromCatalog') setTimeout(() => deliver({ type: 'dialog', id: 'catalog-consent', dialog: { kind: 'message', level: 'warning', modal: true, text: 'Add the MCP server ' + message.id + '?', detail: 'Command: docker run -i --rm -e GITHUB_PERSONAL_ACCESS_TOKEN ghcr.io/github/github-mcp-server\n\nEnvironment: GITHUB_PERSONAL_ACCESS_TOKEN (values hidden)\n\nOn its first start, docker downloads this third-party server and runs it on your computer with your user rights. It is made by GitHub, not by Orka.', actions: ['Add and turn on'] } }), 0);
        if (message.type === 'listTasks') setTimeout(() => deliver({ type: 'history', currentId: 't-now', tasks: [
          { id: 't-now', title: L('Rework the lobby in my Unity project: add a ready state and a 4-player limit.', 'Unity projemde lobby sistemini yeniden düzenle: hazır (ready) durumu ekle ve 4 oyuncu sınırı koy.'), createdAt: new Date(Date.now() - 3600e3).toISOString(), updatedAt: new Date(Date.now() - 120e3).toISOString(), requests: 3, model: 'claude-opus-5-5', usage: { inputTokens: 5900, outputTokens: 2410, cacheReadTokens: 51200, cacheWriteTokens: 6100 } },
          { id: 't-old', title: 'Explain the networking architecture', createdAt: new Date(Date.now() - 2 * 86400e3).toISOString(), updatedAt: new Date(Date.now() - 2 * 86400e3).toISOString(), requests: 1, model: 'gemini-3.8-flash', usage: { inputTokens: 900, outputTokens: 400, cacheReadTokens: 0, cacheWriteTokens: 0 } },
        ] }), 0);
        // Parts of a changed file; Keep and Revert part take one out (as the app does), so review mode can step through them.
        if (message.type === 'getHunks' || message.type === 'keepHunk' || message.type === 'revertHunk') {
          if (!devHunks.has(message.path)) devHunks.set(message.path, [
          { header: '@@ -10,6 +10,9 @@', hidden: 0, lines: [
            { type: ' ', text: 'public class LobbyManager : NetworkBehaviour' }, { type: ' ', text: '{' },
            { type: '-', text: '    private readonly Dictionary<PlayerRef, bool> ready = new();' },
            { type: '+', text: '    public const int MaxPlayers = 4;' },
            { type: '+', text: '    [Networked, Capacity(MaxPlayers)]' },
            { type: '+', text: '    public NetworkDictionary<PlayerRef, NetworkBool> Ready => default;' },
            { type: ' ', text: '' }, { type: ' ', text: '    public override void Spawned()' } ] },
          { header: '@@ -48,4 +51,8 @@', hidden: 0, lines: [
            { type: ' ', text: '    public void OnPlayerJoined(NetworkRunner runner, PlayerRef player)' }, { type: ' ', text: '    {' },
            { type: '+', text: '        if (Ready.Count >= MaxPlayers) { runner.Disconnect(player); return; }' },
            { type: '+', text: '        Ready.Set(player, false);' }, { type: ' ', text: '    }' } ] },
        ]);
          if (message.type !== 'getHunks') devHunks.get(message.path).splice(message.index, 1);
          setTimeout(() => deliver({ type: 'hunks', path: message.path, hunks: devHunks.get(message.path) }), 60);
        }
        if (message.type === 'setSetting' && message.key === 'language') setTimeout(() => { lang = message.value === 'tr' ? 'tr' : 'en'; deliver({ type: 'config', config: makeConfig(false) }); }, 0);
        if (message.type === 'setSetting' && message.key === 'desktop.theme') setTimeout(() => { theme = message.value; deliver({ type: 'config', config: makeConfig(false) }); }, 0);
        if (message.type === 'listSessions') setTimeout(() => deliver({ type: 'sessions', taskId: 't-now', organizer: { groups: [{ id: 'g-1', name: L('Release 1.2', 'Sürüm 1.2') }], assigned: { 't-2': 'g-1', 's-1': 'g-1' }, hidden: ['t-4'] }, groups: [
          { folder: root, name: 'LobbyDemo', tasks: [
            task('t-now', L('Rework the lobby in my Unity project: add a ready state and a 4-player limit.', 'Unity projemde lobby sistemini yeniden düzenle: hazır (ready) durumu ekle ve 4 oyuncu sınırı koy.'), 120, 3),
            task('t-2', L('Fix the jitter when the camera follows the player', 'Kamera oyuncuyu takip ederken oluşan titremeyi düzelt'), 5400),
            task('t-3', L('Explain the networking architecture', 'Networking mimarisini açıkla'), 2 * 86400),
            task('t-4', L('Add a settings menu with volume sliders', 'Ses kaydırıcılarıyla bir ayarlar menüsü ekle'), 4 * 86400, 2),
          ] },
          { folder: 'D:/game/SharedLib', name: 'SharedLib', tasks: [
            task('s-1', L('Write unit tests for the inventory system', 'Envanter sistemi için unit testler yaz'), 3 * 3600, 2),
            task('s-2', L('Upgrade the package to .NET 9', 'Paketi .NET 9\'a yükselt'), 6 * 86400),
          ] },
        ], ...(liveSessions ? { live: liveSessions } : {}) }), 0);
        if (message.type === 'searchFiles') setTimeout(() => deliver({ type: 'fileMatches', query: message.query, files: ['Assets/Scripts/Net/LobbyManager.cs', 'Assets/Scripts/UI/LobbyView.cs'].filter((f) => f.toLowerCase().includes(message.query.toLowerCase())) }), 0);
        if (ide) radarMock(message);
        if (ide) filesMock(message);
        if (ide) foldersMock(message);
        if (ide) browserMock(message);
        accountsMock(message);
        modelMock(message);
      },
      getState: () => ({
        ...(params.has('collapsed') ? { sidebarClosed: true } : {}),
        ...(params.has('radar') ? { asideTab: 'radar' } : {}),
        ...(params.has('files') || params.has('editor') ? { asideTab: 'files' } : {}),
        ...(params.has('browser') ? { asideTab: 'browser' } : {}),
        ...(params.has('editor') ? { editor: { folder: root, path: 'Assets/Scripts/Net/LobbyManager.cs', shown: true, expanded: ['Assets', 'Assets/Scripts', 'Assets/Scripts/Net'] } } : {}),
      }),
      setState: () => {},
    });

    const deliver = (message) => window.dispatchEvent(new MessageEvent('message', { data: message }));
    // ?wait=retrying|rate|approval|tool|starting|compacting|subagent: why the running session waits
    // (status line, session list with ?live), with a running MCP call that offers its own Stop.
    const waitMode = params.get('wait');
    const waitOf = {
      retrying: { reason: 'retrying', until: Date.now() + 12000, attempt: 1, max: 3 },
      rate: { reason: 'rate_limited', until: Date.now() + 20 * 60000, attempt: 2, max: 3 },
      approval: { reason: 'approval' },
      tool: { reason: 'tool', tool: 'mcp__unity__run_tests', title: 'unity · run_tests' },
      starting: { reason: 'starting', agent: 'Claude Code' },
      compacting: { reason: 'compacting' },
      subagent: { reason: 'subagent', agent: 'explore' },
    };
    const shownWait = waitMode ? waitOf[waitMode] ?? waitOf.retrying : undefined;
    // ?live: the open sessions (desktop IDE layout).
    const liveSessions = ide && params.has('live') ? [
      { id: 'live-lobby', folder: 'D:/game/LobbyDemo', name: 'LobbyDemo', taskId: 't-now', title: '', state: 'running', approvals: 0, ...(shownWait ? { wait: shownWait } : {}) },
      { id: 'live-shared', folder: 'D:/game/SharedLib', name: 'SharedLib', taskId: 's-1', title: 'Write unit tests for the inventory system', state: 'approval', approvals: 1, wait: { reason: 'approval' } },
    ] : undefined;
    const ev = (event) => deliver({ type: 'event', event });
    const root = 'D:/game/LobbyDemo';

    let lang = params.has('tr') ? 'tr' : 'en';
    const L = (en, tr) => (params.has('tr') ? tr : en);
    const m = (id, label, family, note) => ({ id, label, family, note });
    const CLAUDE = [
      m('claude-fable-5-1', 'Fable 5.1', 'Claude Fable', 'most capable'), m('claude-fable-5', 'Fable 5', 'Claude Fable'),
      m('claude-opus-5-5', 'Opus 5.5', 'Claude Opus', 'recommended'), m('claude-opus-5', 'Opus 5', 'Claude Opus'), m('claude-opus-4-8', 'Opus 4.8', 'Claude Opus'), m('claude-opus-4-7', 'Opus 4.7', 'Claude Opus'), m('claude-opus-4-6', 'Opus 4.6', 'Claude Opus'),
      m('claude-sonnet-5-5', 'Sonnet 5.5', 'Claude Sonnet', 'fast'), m('claude-sonnet-5', 'Sonnet 5', 'Claude Sonnet'), m('claude-sonnet-4-6', 'Sonnet 4.6', 'Claude Sonnet'),
      m('claude-haiku-4-5', 'Haiku 4.5', 'Claude Haiku', 'fastest'),
    ];
    // ---- Radar (desktop app only): a scripted engine behind the panel.
    const radarMode = params.get('radar') || 'report';
    const RADAR_SOURCES = [
      ['codex', 'OpenAI', 'Codex CLI', 'github.com'], ['gemini-cli', 'Google', 'Gemini CLI', 'github.com'], ['antigravity-cli', 'Google', 'Antigravity CLI', 'github.com'],
      ['zed', 'Zed Industries', 'Zed', 'github.com'], ['copilot-cli', 'GitHub', 'Copilot CLI', 'github.com'], ['cline', 'Cline', 'Cline', 'github.com'],
      ['kilocode', 'Kilo Code', 'Kilo Code', 'github.com'], ['opencode', 'Anomaly', 'OpenCode', 'github.com'], ['claude-code', 'Anthropic', 'Claude Code', 'raw.githubusercontent.com'],
      ['cursor', 'Anysphere', 'Cursor', 'cursor.com'], ['kiro', 'AWS', 'Kiro', 'kiro.dev'], ['vscode', 'Microsoft', 'VS Code', 'code.visualstudio.com'],
      ['github-copilot', 'GitHub', 'Copilot', 'github.blog'], ['chatgpt-codex', 'OpenAI', 'ChatGPT Codex', 'learn.chatgpt.com'],
    ];
    const RADAR_HOSTS = [
      ['github.com', ['Codex CLI', 'Gemini CLI', 'Antigravity CLI', 'Zed', 'Copilot CLI', 'Cline', 'Kilo Code', 'OpenCode', 'Claude Code']],
      ['raw.githubusercontent.com', ['Claude Code']], ['cursor.com', ['Cursor']], ['www.cursor.com', ['Cursor']], ['kiro.dev', ['Kiro']],
      ['code.visualstudio.com', ['VS Code']], ['github.blog', ['Copilot']], ['learn.chatgpt.com', ['ChatGPT Codex']],
    ].map(([host, products]) => ({ host, products }));
    const radar = {
      enabled: radarMode !== 'off', autoAnalyze: false, writeNotes: true, notesDir: '~/.orka/radar/notes',hosts: RADAR_HOSTS, sourceErrors: [], polling: false, maxCalls: 100,
      sources: RADAR_SOURCES.map(([id, vendor, product, host]) => ({ id, vendor, product, host, lastPolledAt: ago(25 * 60), lastStatus: id === 'kiro' ? 'error' : 'not_modified', ...(id === 'kiro' ? { lastError: 'The server answered 404.' } : {}) })),
      lastPollAt: radarMode === 'off' ? undefined : ago(25 * 60),
      pending: radarMode === 'pending' ? 4 : 0, quarantined: radarMode === 'pending' ? 1 : 0,
      choice: { provider: '', model: '' },
      model: { provider: 'claude', model: 'claude-opus-5-5', label: 'Claude API · Opus 5.5', inherited: true },
      ...(radarMode === 'elsewhere' ? { elsewhere: true, pending: 2 } : {}),
      ...(params.has('auto') ? { autoAnalyze: true } : {}),
    };
    const item = (id, vendor, product, title, summary, match, tag, kind = 'feature') => ({ id, vendor, product, title, summary, kind, relevance: 3, match, url: `https://github.com/example/${product.toLowerCase().replace(/\W+/g, '-')}/releases/tag/${tag}`, published: ago(2 * 86400) });
    const radarReport = {
      generatedAt: ago(2 * 3600), provider: { id: 'claude', model: 'claude-opus-5-5' }, needsHuman: 1,
      stats: { entries: 9, calls: 27, inputTokens: 61200, outputTokens: 5400, left: 0 },
      clusters: [
        { key: 'background-agents', title: L('Background agents', 'Arka plan agentları'), vendors: ['OpenAI', 'Anysphere', 'GitHub'], tags: ['agents', 'sessions'], canStart: true,
          items: [
            item('a1', 'OpenAI', 'Codex CLI', L('Tasks keep running in the background', 'Görevler arka planda çalışmaya devam ediyor'), L('Agents continue while the user starts another task; a list shows their progress.', 'Kullanıcı başka bir görev başlatırken agentlar devam ediyor; bir liste ilerlemelerini gösteriyor.'), 'gap', 'rust-v0.92.0'),
            item('a2', 'Anysphere', 'Cursor', L('Background agents in the editor', 'Editörde arka plan agentları'), L('Several agents work in parallel and report back when they finish.', 'Birkaç agent paralel çalışıyor ve bitince haber veriyor.'), 'partial', '2.4'),
            item('a3', 'GitHub', 'Copilot CLI', L('Delegate a task and come back later', 'Bir görevi devret, sonra dön'), L('A task runs on its own and asks for approvals in a queue.', 'Bir görev kendi başına çalışıyor ve onayları bir kuyrukta istiyor.'), 'gap', 'v1.8.0'),
          ],
          comparison: { confidence: 'medium', basis: 'public release notes only', assessment: L('All three let a task continue while the user does something else; they differ in how approvals reach the user.', 'Üçü de kullanıcı başka bir şey yaparken görevin sürmesine izin veriyor; onayların kullanıcıya nasıl ulaştığında ayrışıyorlar.'), approaches: [
            { vendor: 'OpenAI', approach: L('A task list in the terminal; approvals pause the task.', 'Terminalde bir görev listesi; onaylar görevi duraklatıyor.') },
            { vendor: 'Anysphere', approach: L('Parallel agents with a status panel.', 'Durum paneli olan paralel agentlar.') },
            { vendor: 'GitHub', approach: L('Delegated tasks with an approval queue.', 'Onay kuyruğu olan devredilmiş görevler.') },
            { vendor: 'Orka', approach: L('Parallel workers inside one task; the task itself runs in the foreground.', 'Bir görev içinde paralel workerlar; görevin kendisi ön planda çalışıyor.') },
          ] },
          decision: { clusterKey: 'background-agents', decision: 'gap', priority: 'P1', effort: 'M', fitsPrinciples: true, decidedBy: 'model',
            rationale: L('Orka runs one task at a time in the foreground; users wait before starting another.', 'Orka bir seferde bir görevi ön planda çalıştırıyor; kullanıcılar bir başkasını başlatmadan önce bekliyor.'),
            proposal: { title: L('Background tasks', 'Arka plan görevleri'), problem: L('Users wait for a task to finish before they can start another one.', 'Kullanıcılar bir görev bitmeden başka birini başlatamıyor.'), acceptanceCriteria: [L('A task keeps running while another session is open', 'Başka bir oturum açıkken görev çalışmaya devam ediyor'), L('Approvals of a background task show a badge on its session', 'Arka plan görevinin onayları oturumunda bir rozet gösteriyor')], areas: ['agents', 'sessions'] } } },
        { key: 'checkpoints', title: L('Restore points per message', 'Mesaj başına geri yükleme noktaları'), vendors: ['Cline', 'Kilo Code'], tags: ['checkpoints'], canStart: true,
          items: [item('c1', 'Cline', 'Cline', L('Restore files to any message', 'Dosyaları herhangi bir mesaja geri yükle'), L('Each message keeps a snapshot the user can return to.', 'Her mesaj, kullanıcının dönebileceği bir anlık görüntü tutuyor.'), 'partial', 'v3.40.0')],
          decision: { clusterKey: 'checkpoints', decision: 'gap', priority: 'P3', effort: 'S', fitsPrinciples: true, decidedBy: 'model', rationale: L('Orka can go back to a message already; a list of restore points would make it easier to find.', 'Orka zaten bir mesaja geri dönebiliyor; geri yükleme noktalarının listesi bunu bulmayı kolaylaştırır.'),
